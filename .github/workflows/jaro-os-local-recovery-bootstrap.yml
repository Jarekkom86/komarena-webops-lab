name: JARO OS Local Recovery Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recover-local-jaro-os:
    if: github.head_ref == 'jaro-os-recovery-bootstrap-20260801'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Recover KomArena Nexus Transport Worker safely
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          if ($env:OS -ne 'Windows_NT') {
            throw 'The registered self-hosted runner is not Windows; refusing local JARO OS repair.'
          }

          $BridgeRepoPath = 'C:\Users\Jaro\OneDrive\Dokumenty\Agent produkt\jaro-os-bridge'
          if (-not (Test-Path -LiteralPath (Join-Path $BridgeRepoPath '.git'))) {
            throw 'Local jaro-os-bridge clone is missing.'
          }

          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $fetchOutput = @(& $git -C $BridgeRepoPath fetch --prune origin main 2>&1)
            $fetchCode = [int]$LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previous
          }
          if ($fetchCode -ne 0) {
            throw ('Bridge fetch failed: ' + (($fetchOutput | Out-String).Trim()))
          }

          $previous = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $scriptLines = @(& $git -C $BridgeRepoPath show origin/main:bootstrap/recover-transport-worker-v2-safe.ps1 2>&1)
            $showCode = [int]$LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previous
          }
          if ($showCode -ne 0 -or $scriptLines.Count -eq 0) {
            throw ('Safe recovery script could not be read from origin/main: ' + (($scriptLines | Out-String).Trim()))
          }

          $tempScript = Join-Path $env:TEMP ('recover-transport-worker-v2-safe-' + [guid]::NewGuid().ToString('N') + '.ps1')
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($tempScript, (($scriptLines -join "`n") + "`n"), $utf8NoBom)

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($tempScript,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -gt 0) {
            throw ('Safe recovery script parser errors: ' + ((@($parseErrors) | ForEach-Object { $_.Message }) -join ' | '))
          }

          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tempScript
            if (-not $?) { throw 'Safe recovery script returned failure.' }
          }
          finally {
            Remove-Item -LiteralPath $tempScript -Force -ErrorAction SilentlyContinue
          }

          $HealthResult = Join-Path $BridgeRepoPath 'results\task-20260812-bridge-health-readonly-v1.json'
          $deadline = (Get-Date).AddSeconds(180)
          while (-not (Test-Path -LiteralPath $HealthResult -PathType Leaf) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path -LiteralPath $HealthResult -PathType Leaf)) {
            throw 'Transport Worker recovered but the queued read-only health result was not produced within 180 seconds.'
          }

          $health = Get-Content -LiteralPath $HealthResult -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$health.status -ne 'completed' -or [int]$health.exitCode -ne 0) {
            throw ('Read-only health probe did not complete cleanly. status=' + [string]$health.status + ' exitCode=' + [string]$health.exitCode)
          }

          Write-Output 'KOMARENA_NEXUS_RECOVERY=PASS'
          Write-Output ('HEALTH_TASK=' + [string]$health.id)
          Write-Output ('HEALTH_RESULT_CREATED_AT=' + [string]$health.createdAt)
          Write-Output 'WORDPRESS_CHANGED=False'
          Write-Output 'PRODUCTION_CHANGED=False'
